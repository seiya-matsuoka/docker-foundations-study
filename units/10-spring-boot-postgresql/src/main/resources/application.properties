spring.application.name=unit10-spring-postgresql

# Docker Compose から渡された DB_URL / DB_USER / DB_PASSWORD を Spring DataSource へ反映する。
# Compose では DB_URL の Host 部分に PostgreSQL Service 名 postgres を指定する。
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/unit10_db}
spring.datasource.username=${DB_USER:unit10_user}
spring.datasource.password=${DB_PASSWORD:unit10-password}

# Simple depends_on は PostgreSQL の Readiness まで待たない。
# 学習用 Sample では DB が初期化中でも Spring Boot Container 自体が即終了しにくいよう、
# HikariCP の起動時 Connection 取得失敗を Application 起動失敗として扱わない設定にする。
spring.datasource.hikari.initialization-fail-timeout=-1
