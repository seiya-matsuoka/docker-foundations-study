spring.application.name=unit12-spring-backend

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/unit12_db}
spring.datasource.username=${DB_USER:unit12_user}
spring.datasource.password=${DB_PASSWORD:unit12-password}

app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}

# Healthcheck / depends_on を Compose 側で利用するが、
# 起動直後の一時的な DB Connection 失敗で Application が即終了しにくい設定も維持する。
spring.datasource.hikari.initialization-fail-timeout=-1
