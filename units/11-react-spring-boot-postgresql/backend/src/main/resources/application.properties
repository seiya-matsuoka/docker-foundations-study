spring.application.name=unit11-spring-backend

# Docker Compose から渡された DB 接続情報を Spring DataSource へ反映する。
# Compose 起動時の DB_URL は postgres Service を Host として利用する。
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/unit11_db}
spring.datasource.username=${DB_USER:unit11_user}
spring.datasource.password=${DB_PASSWORD:unit11-password}

# Browser 上の React からの Cross-Origin Request に利用する Origin。
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}

# Short syntax の depends_on は PostgreSQL の Readiness まで待たない。
# 学習用 Sample では Backend 起動時に DB 接続を取得できなくても即終了しにくくする。
spring.datasource.hikari.initialization-fail-timeout=-1
